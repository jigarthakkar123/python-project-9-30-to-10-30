{% extends 'seller-header.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <div id="wrapper">
        <!-- ****** Checkout Area Start ****** -->
        <div class="checkout_area section_padding_10">
            <div class="container">
                <div class="row">

                    <div class="col-12 col-md-12">
                        <div class="checkout_details_area mt-50 clearfix">

                            <div class="cart-page-heading">
                                <h5>Edit Product</h5>
                            </div>
                            {% if msg %}
                                <b style="color: red;">{{msg}}</b>
                            {% endif %}
                            <form action="{% url 'seller-edit-product' pk=product.pk %}" method="post" enctype="multipart/form-data">
                                {% csrf_token %}
                                <div class="row">
                                    <div class="col-12 mb-3">
                                        <label for="company">Product Category</label>
                                        <select class="form-control" id="company" name="product_category">
                                            {% if product.product_category == "Men" %}
                                                <option>---Select Product Category---</option>
                                                <option value="Men" selected>Men</option>
                                                <option value="Women">Women</option>
                                                <option value="Kids">Kids</option>
                                                <option value="Accessories">Accessories</option>
                                                <option value="Shoes">Shoes</option>
                                            {% elif product.product_category == "Women" %}
                                                <option>---Select Product Category---</option>
                                                <option value="Men">Men</option>
                                                <option value="Women" selected>Women</option>
                                                <option value="Kids">Kids</option>
                                                <option value="Accessories">Accessories</option>
                                                <option value="Shoes">Shoes</option>
                                            {% elif product.product_category == "Kids" %}
                                                <option>---Select Product Category---</option>
                                                <option value="Men">Men</option>
                                                <option value="Women">Women</option>
                                                <option value="Kids" selected>Kids</option>
                                                <option value="Accessories">Accessories</option>
                                                <option value="Shoes">Shoes</option>
                                            {% elif product.product_category == "Accessories" %}
                                                <option>---Select Product Category---</option>
                                                <option value="Men">Men</option>
                                                <option value="Women">Women</option>
                                                <option value="Kids">Kids</option>
                                                <option value="Accessories" selected>Accessories</option>
                                                <option value="Shoes">Shoes</option>
                                            {% elif product.product_category == "Shoes" %}
                                                <option>---Select Product Category---</option>
                                                <option value="Men">Men</option>
                                                <option value="Women">Women</option>
                                                <option value="Kids">Kids</option>
                                                <option value="Accessories">Accessories</option>
                                                <option value="Shoes" selected>Shoes</option>
                                            {% endif %}
                                            
                                        </select>
                                    </div>
                                    <div class="col-md-12 mb-3">
                                        <label for="first_name">Product Name <span>*</span></label>
                                        <input type="text" class="form-control" id="first_name" name="product_name" value="{{product.product_name}}">
                                    </div>
                                    
                                    <div class="col-12 mb-3">
                                        <label for="company">Product Price</label>
                                        <input type="text" class="form-control" id="company" name="product_price" value="{{product.product_price}}">
                                    </div>
                                    
                                    <div class="col-12 mb-3">
                                        <label for="street_address">Product Details <span>*</span></label>
                                        <input type="text" class="form-control mb-3" id="street_address" name="product_desc" value="{{product.product_desc}}">
                                    </div>
                                    
                                    
                                    <div class="col-12 mb-3">
                                        <img src="{{product.product_image.url}}" style="width: 100px;height: 100px;border-radius: 50%;"> 
                                    </div>
                                    <div class="col-12 mb-3">
                                        <label for="street_address">Product Image <span>*</span></label>
                                        <input type="file" class="form-control mb-3" id="street_address" name="product_image">
                                    </div>
                                    <div class="col-12 mb-3">
                                        <input type="submit" class="btn btn-primary" id="street_address" value="Update Product">
                                        <a href="{% url 'seller-delete-product' pk=product.pk %}"><input type="button" class="btn btn-primary" id="street_address" value="Delete Product"></a>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <!-- ****** Checkout Area End ****** -->
</body>

</html>
{% endblock %}

{% extends 'header.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">

<head>
</head>

<body>
    <div id="wrapper">
        <!-- ****** Checkout Area Start ****** -->
        <div class="checkout_area section_padding_10">
            <div class="container">
                <div class="row">

                    <div class="col-12 col-md-12">
                        <div class="checkout_details_area mt-50 clearfix">

                            <div class="cart-page-heading">
                                <h5>Forgot Password</h5>
                            </div>
                            {% if msg %}
                                <b style="color: red;">{{msg}}</b>
                            {% endif %}
                            <form action="{% url 'forgot-password' %}" method="post">
                                {% csrf_token %}
                                <div class="row">
                                    
                                    <div class="col-12 mb-3">
                                        <label for="company">Mobile</label>
                                        <input type="text" class="form-control" id="company" name="mobile">
                                    </div>
                                    
                                    
                                    
                                    <div class="col-12 mb-3">
                                        <input type="submit" class="btn btn-primary" id="street_address" value="Send OTP">
                                        
                                    </div>

                                </div>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <!-- ****** Checkout Area End ****** -->
</body>

</html>
{% endblock %}
